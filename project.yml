name: TokenMonitor
options:
  bundleIdPrefix: com.suprie.token-monitor
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO

targets:
  TokenMonitor:
    type: application
    platform: macOS
    sources:
      - TokenMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suprie.token-monitor
        INFOPLIST_FILE: TokenMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: TokenMonitor/TokenMonitor.entitlements
        PRODUCT_NAME: "Token Monitor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  TokenMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClaudeMonitorTests
    resources:
      - ClaudeMonitorTests/Fixtures
    dependencies:
      - target: TokenMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suprie.token-monitor.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TokenMonitor:
    build:
      targets:
        TokenMonitor: all
        TokenMonitorTests: [test]
    test:
      targets:
        - TokenMonitorTests
