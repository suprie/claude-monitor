name: TakarPakai
options:
  bundleIdPrefix: com.suprie.takar-pakai
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO

targets:
  TakarPakai:
    type: application
    platform: macOS
    sources:
      - TakarPakai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suprie.takar-pakai
        INFOPLIST_FILE: TakarPakai/Info.plist
        CODE_SIGN_ENTITLEMENTS: TakarPakai/TakarPakai.entitlements
        PRODUCT_NAME: "Takar Pakai"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  TakarPakaiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TakarPakaiTests
    resources:
      - TakarPakaiTests/Fixtures
    dependencies:
      - target: TakarPakai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suprie.takar-pakai.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TakarPakai:
    build:
      targets:
        TakarPakai: all
        TakarPakaiTests: [test]
    test:
      targets:
        - TakarPakaiTests
